<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: 'Segoe UI', Inter, system-ui, sans-serif; color: #fff; }
  .bg { position: fixed; inset: -10%; background:
      radial-gradient(circle at 30% 30%, rgba(37,99,235,.55), transparent 45%),
      radial-gradient(circle at 75% 70%, rgba(30,64,175,.6), transparent 50%),
      radial-gradient(circle at 50% 110%, rgba(56,189,248,.25), transparent 50%), #020617;
      animation: drift 18s ease-in-out infinite alternate; }
  .grid { position: fixed; inset: -50%; background-image: linear-gradient(rgba(147,197,253,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(147,197,253,.07) 1px, transparent 1px);
      background-size: 64px 64px; transform: perspective(900px) rotateX(58deg) translateY(-8%); animation: gridmove 12s linear infinite; mask-image: radial-gradient(circle at 50% 40%, #000 0, transparent 60%); }
  .vignette { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,.75) 100%); }
  .bars:before, .bars:after { content: ''; position: fixed; left: 0; right: 0; height: 9vh; background: #000; z-index: 9; }
  .bars:before { top: 0; } .bars:after { bottom: 0; }
  @keyframes drift { to { transform: scale(1.12) translate(2%, -2%); } }
  @keyframes gridmove { to { background-position: 0 64px, 0 0; } }
  .dot { position: fixed; width: 3px; height: 3px; border-radius: 50%; background: #93c5fd; box-shadow: 0 0 8px #60a5fa; opacity: 0; animation: float linear infinite; }
  @keyframes float { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .9; } 100% { opacity: 0; transform: translateY(-40vh); } }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; z-index: 5; }
  .fade { opacity: 0; animation: rise 1.4s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  .line { font-size: 64px; font-weight: 700; letter-spacing: -.02em; margin: 10px 0; text-shadow: 0 0 40px rgba(59,130,246,.6); }
  .line.red { color: #fca5a5; text-shadow: 0 0 40px rgba(239,68,68,.6); }
  .q { font-size: 76px; font-weight: 800; background: linear-gradient(90deg, #fff, #93c5fd, #fff); background-size: 200% 100%; -webkit-background-clip: text; color: transparent; animation: rise 1.6s forwards, shine 3s linear 1.6s infinite; }
  @keyframes shine { to { background-position: -200% 0; } }
  .shield { width: 190px; height: 190px; margin: 0 auto 30px; filter: drop-shadow(0 0 40px rgba(59,130,246,.9)); animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: drop-shadow(0 0 70px rgba(96,165,250,1)); transform: scale(1.04); } }
  .brand { font-size: 128px; font-weight: 800; letter-spacing: -.04em; background: linear-gradient(180deg, #fff 30%, #93c5fd); -webkit-background-clip: text; color: transparent; }
  .tag { font-size: 30px; color: #bfdbfe; margin-top: 12px; letter-spacing: .02em; }
  .chips { display: flex; gap: 18px; justify-content: center; margin-top: 46px; }
  .chip { padding: 14px 26px; border-radius: 999px; border: 1px solid rgba(147,197,253,.4); background: rgba(37,99,235,.18); font-size: 26px; font-weight: 600; backdrop-filter: blur(6px); }
  .credit { font-size: 22px; color: #93c5fd; margin-top: 50px; line-height: 1.6; }
  .ecg { width: 760px; height: 120px; margin: 26px auto 0; }
  .ecg path { stroke: #60a5fa; stroke-width: 4; fill: none; stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s ease forwards 0.6s; filter: drop-shadow(0 0 10px #3b82f6); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body class="bars">
  <div class="bg"></div><div class="grid"></div><div id="dots"></div><div class="vignette"></div>
  <div class="stage"><div id="content"></div></div>
<script>
  const scene = new URLSearchParams(location.search).get('scene') || 'title';
  const d = document.getElementById('dots');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('span'); s.className = 'dot';
    s.style.left = Math.random() * 100 + 'vw'; s.style.top = 40 + Math.random() * 70 + 'vh';
    s.style.animationDuration = 6 + Math.random() * 8 + 's'; s.style.animationDelay = -Math.random() * 10 + 's';
    d.appendChild(s);
  }
  const shield = `<svg class="shield" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs><path d="M32 4 8 13v17c0 15 10.4 26.6 24 30 13.6-3.4 24-15 24-30V13L32 4Z" fill="url(#g)"/><path d="M18 34h8l4-9 5 16 4-7h7" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const c = document.getElementById('content');
  const delay = (html, s) => html.replace('class="', `style="animation-delay:${s}s" class="`);
  if (scene === 'intro') {
    c.innerHTML = [
      delay('<div class="line fade">Every minute of downtime costs trust.</div>', 0.3),
      delay('<div class="line red fade">Services crash.</div>', 4.2),
      delay('<div class="line red fade">Memory leaks.</div>', 5.4),
      delay('<div class="line red fade">Deployments break.</div>', 6.6),
      delay('<div class="q fade" style="margin-top:40px">What if software could heal itself?</div>', 11.2),
    ].join('');
  } else if (scene === 'title') {
    c.innerHTML = `<div class="fade">${shield}</div>` +
      delay('<div class="brand fade">AegisHeal</div>', 0.6) +
      delay('<div class="tag fade">Agentic AI · Autonomous Fault Recovery · Resilience</div>', 1.6) +
      delay('<svg class="ecg fade" viewBox="0 0 760 120"><path d="M0 60 H250 L285 20 L320 110 L355 5 L390 95 L420 60 H760"/></svg>', 2.2);
  } else {
    c.innerHTML = `<div class="fade">${shield.replace('class="shield"', 'class="shield" style="width:130px;height:130px"')}</div>` +
      delay('<div class="brand fade" style="font-size:96px">AegisHeal</div>', 0.4) +
      '<div class="chips">' + ['Detect', 'Diagnose', 'Recover', 'Verify'].map((w, i) => delay(`<div class="chip fade">${w}</div>`, 1.4 + i * 0.6)).join('') + '</div>' +
      delay('<div class="tag fade" style="margin-top:36px">Software that heals itself.</div>', 4.4) +
      '';
  }
</script>
</body>
</html>
